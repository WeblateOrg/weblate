<html lang="en">
  <head>
    <meta charset="utf-8">
    <title>Orbit billing</title>
    <style>
      body { margin: 0; font: 16px Arial, sans-serif; color: #233347; }
      main { width: 300px; background: #f5f7fa; }
      header { padding: 16px; background: #233347; color: white; }
      header span { float: right; color: #dce5ef; font-size: 14px; }
      section { padding: 16px; }
      h1 { margin: 0 0 16px; font-size: 22px; }
      .banner { padding: 18px; border: 1px solid #9ab6d6; border-radius: 6px; background: #eaf2fc; }
      p { margin: 0 0 16px; line-height: 1.5; }
      button { padding: 9px 14px; border: 0; border-radius: 4px; background: #285b92; color: white; font: inherit; }
    </style>
  </head>
  <body>
    <main>
      <header><strong>Orbit</strong><span>Acme workspace</span></header>
      <section aria-labelledby="billing-title">
        <h1 id="billing-title">Billing</h1>
        <div class="banner">
          <p>Your workspace trial ends in 5 days.</p>
          <button type="button">Choose a plan</button>
        </div>
      </section>
    </main>
  </body>
</html>
