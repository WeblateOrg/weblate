{% load user_display %}

{% if user_list %}
  <tr>
    <th>
      {{ user_title }}<span class="badge text-bg-secondary">{{ user_list|length }}</span>
    </th>
    <td colspan="2" class="full-cell">
      {% for admin in user_list|slice:":25" %}
        {% user_display admin %}
      {% endfor %}
      {% if user_list|length > 25 %}…{% endif %}
    </td>
  </tr>
{% endif %}
