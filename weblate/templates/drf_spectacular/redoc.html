{% load i18n static %}

{# Based on upstream template, removes Google fonts and add own font #}

<!DOCTYPE html>
<html lang="{{ LANGUAGE_CODE }}"
      dir="{% if LANGUAGE_BIDI %}rtl{% else %}ltr{% endif %}">
  <head>
    {% block head %}
      <title>{% translate "Weblate's REST API" %}</title>
      <meta charset="utf-8">
      <meta name="viewport" content="width=device-width, initial-scale=1">
      <meta name="description" content="{{ description }}" />
      <link rel="stylesheet" href="{% static 'weblate_fonts/source-code-pro.css' %}" />
      <link rel="stylesheet" href="{% static 'weblate_fonts/source-sans-3.css' %}" />
      <link rel="stylesheet" href="{% static 'styles/redoc.css' %}" />
    {% endblock head %}

  </head>
  <body>
    {% block body %}
      {% if settings %}
        <div id="redoc-container"
             data-schema-url="{{ schema_url }}"
             data-settings="{{ settings|force_escape }}"></div>
        <script src="{{ redoc_standalone }}"></script>
        <script src="{% static 'js/redoc.js' %}"></script>
      {% else %}
        <redoc spec-url="{{ schema_url }}"></redoc>
        <script src="{{ redoc_standalone }}"></script>
      {% endif %}
    {% endblock body %}

  </body>
</html>
