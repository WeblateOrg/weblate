name: Devcontainer

on:
  pull_request:
    paths:
    - .devcontainer/**
    - dev-docker/**
    - scripts/devcontainer
    - ci/pip-install
    - pyproject.toml
    - uv.lock
    - weblate/settings_test.py
    - weblate/settings_example.py
    - .github/workflows/devcontainer.yml
  push:
    branches: [main]
    paths:
    - .devcontainer/**
    - dev-docker/**
    - scripts/devcontainer
    - ci/pip-install
    - pyproject.toml
    - uv.lock
    - weblate/settings_test.py
    - weblate/settings_example.py
    - .github/workflows/devcontainer.yml

permissions:
  contents: read

jobs:
  smoke:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      with:
        persist-credentials: false
    - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
      with:
        node-version: 24
        package-manager-cache: false
    - name: Install Dev Container CLI
      # Standalone CLI, pinned independently of the application's client dependencies.
      run: npm install --global @devcontainers/cli@0.89.0 # zizmor: ignore[adhoc-packages]
    - name: Test worktree configuration
      run: python3 -m unittest discover -s .devcontainer -p test_environment.py
    - name: Test container bootstrap and isolation
      run: python3 .devcontainer/smoke.py
    - name: Check existing development application
      run: |
        ./rundev.sh start
        ./rundev.sh wait
        ./rundev.sh check
    - name: Stop existing development application
      if: always()
      run: |
        ./rundev.sh logs
        ./rundev.sh stop
