name: Android resources

on:
  push:
    branches-ignore:
    - renovate/**
    - weblate
    - dependabot/**
    - copilot/**
    - codex/**
  pull_request:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.event_name == 'pull_request' && github.event.pull_request.number || github.run_id }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  android:
    name: ARSC on Android API ${{ matrix.api-level }}
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        api-level: [30, 36]
    env:
      PYTHONPATH: ${{ github.workspace }}
    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      with:
        persist-credentials: false
    - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
      with:
        python-version: '3.14'
    - uses: astral-sh/setup-uv@bec219d24cd3e171d82865faccec33120bb574f4 # v10.1.0
      with:
        version: 0.12.13
        cache-suffix: android
        save-cache: ${{ github.ref == 'refs/heads/main' }}
    - uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5.7.0
      with:
        distribution: temurin
        java-version: '17'
    - uses: gradle/actions/setup-gradle@0723195856401067f7a2779048b490ace7a47d7c # v5.0.2
      with:
        gradle-version: '8.7'
        cache-read-only: ${{ github.ref != 'refs/heads/main' }}
    - uses: android-actions/setup-android@9fc6c4e9069bf8d3d10b2204b1fb8f6ef7065407 # v3.2.2
      with:
        packages: platform-tools platforms;android-35 build-tools;35.0.0
    - name: Validate ARSC with AAPT2
      run: AAPT2="$ANDROID_HOME/build-tools/35.0.0/aapt2" uv run --frozen --only-group android python -m unittest weblate.kotlin_sdk.test_arsc -v
    - name: Generate resource fixtures
      run: uv run --frozen --only-group android python ci/android-arsc/generate-fixtures.py
    - name: Build instrumentation harness
      run: gradle -p ci/android-arsc --no-daemon --stacktrace assembleDebug assembleDebugAndroidTest
    - name: Enable KVM
      run: |
        echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
        sudo udevadm control --reload-rules
        sudo udevadm trigger --name-match=kvm
    - name: Test resource loading on Android
      uses: reactivecircus/android-emulator-runner@a421e43855164a8197daf9d8d40fe71c6996bb0d # v2.38.0
      with:
        api-level: ${{ matrix.api-level }}
        target: google_apis
        arch: x86_64
        disable-animations: true
        disable-linux-hw-accel: false
        script: gradle -p ci/android-arsc --no-daemon --stacktrace connectedDebugAndroidTest
    - name: Upload Android test reports
      if: ${{ !cancelled() }}
      uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
      with:
        name: android-arsc-api-${{ matrix.api-level }}
        path: |
          ci/android-arsc/build/reports/androidTests/
          ci/android-arsc/build/outputs/androidTest-results/
          ci/android-arsc/build/generated/assets/
        retention-days: 14
