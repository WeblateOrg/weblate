name: API

on:
  push:
    branches-ignore:
    - renovate/**
    - weblate
    - weblate-*
    - dependabot/**
    - copilot/**
    - codex/**
  pull_request:

permissions:
  contents: read

jobs:
  api-lint:
    runs-on: ubuntu-26.04
    name: API Lint
    env:
      PYTHONWARNINGS: default,ignore:unclosed:ResourceWarning
      PYTHONUNBUFFERED: 1
    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      with:
        persist-credentials: false
    - name: Set up Python
      id: setup_python
      uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
      with:
        python-version: '3.14'
    - uses: astral-sh/setup-uv@1db35dd8eee11c5894872e0b383ae6c406cf738d # v10.4.0
      with:
        enable-cache: false
        cache-local-path: ${{ runner.temp }}/weblate-uv-cache
        version: 0.13.10
    - name: Install apt dependencies
      uses: $/.github/actions/apt-install
    - name: Used versions
      run: ./ci/print-versions
    - name: Restore Python dependencies
      id: python-cache
      uses: $/.github/actions/python-cache-restore
      with:
        python-version: ${{ steps.setup_python.outputs.python-version }}
    - name: Install Python dependencies
      run: ./ci/pip-install latest
    - name: Save Python dependencies
      uses: $/.github/actions/python-cache-save
      with:
        primary-key: ${{ steps.python-cache.outputs.primary-key }}
        exact-hit: ${{ steps.python-cache.outputs.exact-hit }}
        cache-directory: ${{ steps.python-cache.outputs.cache-directory }}
    - name: Generate OpenAPI
      run: |
        echo "::add-matcher::.github/matchers/spectacular.json"
        make -C docs update-openapi
        echo "::remove-matcher owner=spectacular::"
    - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
      with:
        node-version: 26
        package-manager-cache: false
    - name: Install OpenAPI linter
      working-directory: ./client
      run: yarn install --frozen-lockfile
    - name: openapi-lint
      run: client/node_modules/.bin/redocly lint --extends recommended-strict --format github-actions docs/specs/openapi.yaml
    - name: Verify OpenAPI spec is up to date
      run: git diff --exit-code
    - uses: pre-commit-ci/lite-action@062bca0919bc9d6e66755cc05074b70c77e111fc # v1.2.0
      if: always()
      with:
        msg: 'chore(docs): update OpenAPI schema'
