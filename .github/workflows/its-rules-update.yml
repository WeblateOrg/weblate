name: ITS rules update

on:
  push:
    branches:
    - renovate/**
    - dependabot/**
    - main
    paths:
    - .github/workflows/its-rules-update.yml
    - scripts/update-gettext-rules.py
    - weblate/addons/extractors/gettext/**
  workflow_dispatch:
  pull_request:
    paths:
    - .github/workflows/its-rules-update.yml
    - scripts/update-gettext-rules.py
    - weblate/addons/extractors/gettext/**

permissions:
  contents: read

jobs:
  its-rules-update:
    runs-on: ubuntu-26.04

    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1   # v7.0.1
      with:
        persist-credentials: false
    - uses: astral-sh/setup-uv@18d369b23da25a81e9458561248e1aafff6a70fa # v10.3.1
      with:
        enable-cache: false
        version: 0.13.1
    - name: Set up Python
      uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
      with:
        python-version: '3.14'
    - name: Install Python dependencies
      run: uv sync --only-group scripts --only-group pre-commit
    - run: uv run --frozen --only-group scripts scripts/update-gettext-rules.py

    - name: Prepare maintenance patch
      uses: $/.github/actions/auto-commit

    # Keep this outside the composite action; pre-commit.ci lite detects the
    # top-level post step, and composites expose nested post hooks.
    # The condition mirrors pre-commit-ci/lite-action's main.mjs user-PR check.
    - name: Commit changes (external PR, pre-commit-ci-lite)
      if: github.event_name == 'pull_request' && github.event.sender.type == 'User'
      uses: pre-commit-ci/lite-action@062bca0919bc9d6e66755cc05074b70c77e111fc # v1.2.0
      with:
        msg: 'chore: update gettext ITS rules'
