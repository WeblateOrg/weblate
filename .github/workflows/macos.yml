name: macOS

on:
  push:
    branches:
    - main
    - stable
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.event_name == 'pull_request' && github.event.pull_request.number || github.run_id }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  macos:
    # This verifies that installation instructions works, any changes here
    # need to be reflected in docs/admin/install/venv-macos.rst
    runs-on: macos-26
    env:
      PYTHONUNBUFFERED: 1
      PYTHONWARNINGS: default,ignore:unclosed:ResourceWarning
      CI_REDIS_HOST: localhost
      CI_DB_HOST: localhost
      DJANGO_SETTINGS_MODULE: weblate.settings_test
      CI_SKIP_SAML: 1
      HOMEBREW_NO_AUTO_UPDATE: '1'
      # renovate-homebrew-brew
      HOMEBREW_BREW_REF: 59febf998bd38fdbbac2f6d2d1e591cfa109a7d6
      # renovate-homebrew-core
      HOMEBREW_CORE_REF: 07f11c6fa9cf6dc221185d5bf17a0099a0ee025b
      # renovate-homebrew-cask
      HOMEBREW_CASK_REF: 5162dcf26801c8a398b1621bddeb1743649bd1fe
    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      with:
        persist-credentials: false
    - name: Pin Homebrew snapshot
      run: |
        brew_repo="$(brew --repo)"
        git -C "${brew_repo}" reset --hard
        git -C "${brew_repo}" clean -fd
        git -C "${brew_repo}" fetch --no-tags --depth=1 origin "${HOMEBREW_BREW_REF}"
        git -C "${brew_repo}" checkout --force -B stable FETCH_HEAD

        # Core and cask migration maps must come from the same snapshot.
        brew tap --force homebrew/cask
        cask_repo="$(brew --repo homebrew/cask)"
        git -C "${cask_repo}" reset --hard
        git -C "${cask_repo}" clean -fd
        git -C "${cask_repo}" fetch --no-tags --depth=1 origin "${HOMEBREW_CASK_REF}"
        git -C "${cask_repo}" checkout --force --detach FETCH_HEAD
        git -C "${cask_repo}" rev-parse HEAD

        brew tap --force homebrew/core
        core_repo="$(brew --repo homebrew/core)"
        git -C "${core_repo}" reset --hard
        git -C "${core_repo}" clean -fd
        git -C "${core_repo}" fetch --no-tags --depth=1 origin "${HOMEBREW_CORE_REF}"
        git -C "${core_repo}" checkout --force --detach FETCH_HEAD
        git -C "${core_repo}" rev-parse HEAD
        echo "HOMEBREW_NO_INSTALL_FROM_API=1" >> "${GITHUB_ENV}"
        brew --version
    - run: brew list --versions
    - run: brew config
    - run: brew doctor
      continue-on-error: true
    - name: Install brew dependencies
      run: |
        brew install python libyaml pkgconf zstd lz4 xxhash libxmlsec1 uv
    - name: Install test dependencies
      run: |
        brew install icu4c valkey postgresql
        brew link --force icu4c
    - name: Show brew dependency tree
      run: brew deps --tree python libyaml pkgconf zstd lz4 xxhash libxmlsec1 uv icu4c valkey postgresql
    - name: Start services
      run: |
        brew services start postgresql
        brew services start valkey
    - name: Install Weblate
      run: |
        uv venv .venv
        source .venv/bin/activate
        uv sync --frozen --all-extras --dev --no-binary-package lxml --no-binary-package xmlsec
    - name: Test with Django
      run: |
        sysctl machdep.cpu.brand_string hw.logicalcpu > test-cpu.txt
        # shellcheck disable=SC2155
        export CI_DB_USER="$(id -nu)"
        source .venv/bin/activate
        /usr/bin/time -l -o test-resources.txt pytest --junitxml=junit.xml --cov=weblate --cov-report=xml --numprocesses=auto weblate
    - name: Upload test timing and resource evidence
      if: ${{ !cancelled() }}
      uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
      with:
        name: test-evidence-macos
        path: |
          junit.xml
          test-cpu.txt
          test-resources.txt
        if-no-files-found: warn
    - uses: codecov/codecov-action@303a32d7a59b442fa8d48b6a1cc6825c09c847a5 # v7.1.1
      with:
        token: ${{secrets.CODECOV_TOKEN}} # zizmor: ignore[secrets-outside-env]
        flags: unittests
        name: Tests macos
    - name: Upload test results to Codecov
      if: ${{ !cancelled() }}
      uses: codecov/codecov-action@303a32d7a59b442fa8d48b6a1cc6825c09c847a5 # v7.1.1
      with:
        token: ${{ secrets.CODECOV_TOKEN }} # zizmor: ignore[secrets-outside-env]
        report_type: test_results
