name: Migrations

on:
  push:
    branches:
    - main
    - stable
  pull_request:
concurrency:
  group: ${{ github.workflow }}-${{ github.event_name == 'pull_request' && github.event.pull_request.number || github.run_id }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  migrations:
    runs-on: ubuntu-26.04
    name: postgresql
    env:
      # This is needed for older versions to migrate, can be removed once migration from 5.17+ only is supported
      CI_DATABASE: postgresql
      CI_DB_PASSWORD: weblate
      CI_DB_HOST: 127.0.0.1
      CI_DB_PORT: '5432'
      CI_SELENIUM: '1'
      DJANGO_SETTINGS_MODULE: weblate.settings_test
      UV_FROZEN: '1'
    services:
      database:
        image: postgres:18.6-alpine@sha256:898c60cb390d1085bc97bdd6a1ae968757421df394b071848b52b1c09c89d6a5
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: weblate
        ports:
        - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      with:
        persist-credentials: false
    - name: Install apt dependencies
      run: sudo ./ci/apt-install
    - name: Install legacy rendering dependencies
      run: sudo apt-get install -y libgirepository-2.0-dev libcairo-dev gir1.2-rsvg-2.0 gir1.2-pango-1.0
    - uses: astral-sh/setup-uv@07a047e608db84b3d8c06cd9a7c7dcc9c355c18e # v10.3.2
      with:
        enable-cache: true
        # Do not share cache with tests as this uses python 3.11 for older versions
        cache-suffix: multi
        save-cache: ${{ github.ref == 'refs/heads/main' }}
        version: 0.13.5
    - name: Set up Python
      uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
      with:
        python-version: |
          3.11
          3.13
    - name: Install Python dependencies
      run: ./ci/pip-install latest
    - name: Check missing migrations
      run: ./ci/run-checkmigrate
    - name: Migrate from 5.10
      run: ./ci/run-migrate 5.10
    - name: Migrate from 5.11
      run: ./ci/run-migrate 5.11
    - name: Migrate from 5.12
      run: ./ci/run-migrate 5.12
    - name: Migrate from 5.13
      run: ./ci/run-migrate 5.13
    - name: Migrate from 5.14
      run: ./ci/run-migrate 5.14
    - name: Migrate from 5.15
      run: ./ci/run-migrate 5.15
    - name: Migrate from 5.16
      run: ./ci/run-migrate 5.16
    - name: Migrate from 5.17
      run: ./ci/run-migrate 5.17
    - name: Migrate from 2026.5
      run: ./ci/run-migrate 2026.5
    - name: Migrate from 2026.6
      run: ./ci/run-migrate 2026.6
    - name: Migrate from 2026.7
      run: ./ci/run-migrate 2026.7
    - name: Migrate from 2026.8
      run: ./ci/run-migrate 2026.8
    - name: Migrate from 2026.9
      run: ./ci/run-migrate 2026.9
    - name: Migrate from 2026.10
      run: ./ci/run-migrate 2026.10
    - name: Coverage
      run: |
        uv run coverage combine
        uv run coverage xml
    - uses: codecov/codecov-action@303a32d7a59b442fa8d48b6a1cc6825c09c847a5 # v7.1.1
      with:
        token: ${{secrets.CODECOV_TOKEN}} # zizmor: ignore[secrets-outside-env]
        flags: migrations
        name: Migrations postgresql
