# Shared services and application QA, included by .devcontainer/compose.yaml.
# Start through rundev.sh or scripts/devcontainer so ports are initialized.
services:
  weblate:
    profiles: [app]
    build:
      context: ./weblate-dev
    init: true
    depends_on:
      app-database:
        condition: service_healthy
      app-cache:
        condition: service_healthy
      maildev:
        condition: service_started
    networks: [app]
    volumes:
    - app-data:/app/data
    - app-venv:/app/venv
    - app-home:/home/weblate
    environment:
      DJANGO_SETTINGS_MODULE: weblate.settings_docker
      WEBLATE_SITE_DOMAIN_FILE: /run/site-domain
      WEBLATE_EMAIL_HOST: maildev
      WEBLATE_EMAIL_PORT: 1025
      WEBLATE_EMAIL_USE_TLS: 0
      WEBLATE_EMAIL_USE_SSL: 0
      POSTGRES_HOST: app-database
      REDIS_HOST: app-cache
      WEB_WORKERS: 1
      CELERY_WORKER_MODE: combined
      CELERY_MAIN_OPTIONS: --concurrency=2
      HOME: /home/weblate
      UV_CACHE_DIR: /app/data/uv-cache
      PRE_COMMIT_HOME: /app/data/prek-cache
      XDG_CACHE_HOME: /app/data/tool-cache
    env_file:
    - ./environment
    ports:
    - target: 8080
      host_ip: 127.0.0.1
    userns_mode: host
  app-database:
    profiles: [app]
    extends:
      service: database
    networks: [app]
    environment:
      POSTGRES_USER: weblate
      POSTGRES_PASSWORD: weblate
      POSTGRES_DB: weblate
    volumes:
    - app-postgres-data:/var/lib/postgresql
  app-cache:
    profiles: [app]
    extends:
      service: cache
    networks: [app]
    volumes:
    - app-valkey-data:/data
    command: [valkey-server, --save, '60', '1']
  maildev:
    profiles: [app]
    image: maildev/maildev:2.2.1@sha256:180ef51f65eefebb0e7122d8308813c1fd7bff164bc440ce5a3c2feee167a810
    networks: [app]
    ports:
    - target: 1080
      host_ip: 127.0.0.1

  database:
    image: postgres:18.6-alpine@sha256:d3e1620b530c944afa6e887d22eb899824da68e19c52024bf98f5220c88a65b2
    volumes:
    - postgres-data:/var/lib/postgresql
    healthcheck:
      test: [CMD-SHELL, pg_isready -U "$$POSTGRES_USER" -d "$$POSTGRES_DB"]
      interval: 2s
      timeout: 5s
      retries: 30

  cache:
    image: valkey/valkey:9.1.2-alpine@sha256:ccfa19b0d743e48927e1c8c14e39e0acb97b5cea347fef0bfe340247fea920cd
    volumes:
    - valkey-data:/data
    healthcheck:
      test: [CMD, valkey-cli, ping]
      interval: 2s
      timeout: 5s
      retries: 30
